name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Configure and verify npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN repository secret is missing or empty."
            exit 1
          fi
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm whoami --registry https://registry.npmjs.org/
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build library
        run: pnpm --filter raditail build
      - name: Version, publish and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Consume any pending changesets: bump versions, write changelogs.
          pnpm changeset version
          pnpm install --no-frozen-lockfile --lockfile-only

          if ! git diff --quiet; then
            git add -A
            git commit -m "chore: version packages [skip ci]"
          fi

          # Publishes anything whose version is not yet on npm, and creates tags.
          pnpm changeset publish

          # Pushes made with GITHUB_TOKEN do not re-trigger workflows, so this
          # cannot loop.
          git push --follow-tags origin HEAD:main
